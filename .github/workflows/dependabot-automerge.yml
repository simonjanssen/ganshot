name: Dependabot auto-merge

# pull_request_target so the Dependabot-triggered run can read the repo secrets
# needed to mint the release App token. Safe here: we never check out or run
# the PR's code, we only read its metadata and call the merge API.
on: pull_request_target

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    name: Auto-merge minor/patch
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      # Merge with the release App token (not GITHUB_TOKEN) so the resulting
      # push to main triggers release.yml. GITHUB_TOKEN merges would not.
      - name: Generate GitHub App token
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Enable auto-merge for minor/patch updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
